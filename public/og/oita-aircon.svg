<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" rx="16"/>
  <text x="600" y="240" text-anchor="middle"
        font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif"
        font-size="48" font-weight="500" fill="rgba(255,255,255,0.85)">
    大分市・エアコン分解洗浄
  </text>
  <text x="600" y="340" text-anchor="middle"

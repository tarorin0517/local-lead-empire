<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect x="12" y="16" width="67" height="28" rx="6" fill="#1E40AF"/>
  <text x="20" y="34"
        font-family="'Noto Sans JP','Hiragino Sans',sans-serif"
        font-size="12" font-weight="700" fill="#FFFFFF">STEP1</text>
  <text x="50%" y="46%" text-anchor="middle"
        font-family="'Noto Sans JP','Hiragino Sans',sans-serif"
        font-size="28" font-weight="700" fill="#FFFFFF">STEP1 ご予約</text>
  <text x="50%" y="58%" text-anchor="middle"
        font-family="'Noto Sans JP','Hiragino Sans',sans-serif"
        font-size="14" font-weight="500" fill="rgba(255,255,255,0.8)">宮崎市・お問い合わせ</text>
</svg>
